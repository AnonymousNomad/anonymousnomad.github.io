<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#050507" />

    <title>Neuro_Nomad — Sovereign systems. Local-first. Forever offline.</title>
    <meta
      name="description"
      content="Offline-first, model-agnostic developer workbench and sovereign tooling. Built by Neuro_Nomad (AnonymousNomad) — licensed electrician turned self-taught solo developer."
    />
    <meta property="og:title" content="Neuro_Nomad — Sovereign systems" />
    <meta
      property="og:description"
      content="AIDE Workbench, GhostCode, Vitalis cognitive engines, Cyber SOP Harness, LOREIN. All open source. All offline-first."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Strict Content-Security-Policy: no third-party fetches, no eval -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.github.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';"
    />

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='40' fill='%2300FF41'/%3E%3Ctext x='50' y='65' text-anchor='middle' font-family='monospace' font-size='40' font-weight='bold' fill='%23050507'%3EN%3C/text%3E%3C/svg%3E" />

    <link rel="stylesheet" href="src/styles/tokens.css" />
    <link rel="stylesheet" href="src/styles/global.css" />

    <script type="module" src="src/main.js" defer></script>
  </head>

  <body>
    <a href="#hero" class="skip-link">Skip to main content</a>

    <!-- Header (rendered by JS, slot here) -->
    <header id="site-header" class="site-header"></header>

    <!-- Main scroll container -->
    <main id="main">

      <!-- 1. Hero (AIDE flagship) -->
      <section id="hero" class="section hero" aria-label="Hero"></section>

      <!-- 2. About (electrician → AI architect) -->
      <section id="about" class="section about" aria-label="About"></section>

      <!-- 3. AIDE Workbench (flagship) -->
      <section id="aide" class="section aide" aria-label="AIDE Sovereign Workbench"></section>

      <!-- 4. GhostCode (concept demo) -->
      <section id="ghostcode" class="section ghostcode" aria-label="GhostCode"></section>

      <!-- 4b. Proof Gallery (real EVIDENCE) -->
      <section id="proof" class="section proof" aria-label="Proof — what we actually built"></section>

      <!-- 5. Cognitive Engines (Vitalis) -->
      <section id="vitalis" class="section vitalis" aria-label="Cognitive Engines"></section>

      <!-- 6. Cyber SOP Harness (security) -->
      <section id="cyber" class="section cyber" aria-label="Cyber SOP Harness"></section>

      <!-- 7. LOREIN (persistent intelligence) -->
      <section id="lorein" class="section lorein" aria-label="LOREIN"></section>

      <!-- 8. Footer -->
      <footer id="site-footer" class="site-footer"></footer>

    </main>

    <style>
      /* Inline critical CSS for above-the-fold (hero). Full styles in global.css. */
      .skip-link {
        position: absolute;
        top: -100px;
        left: 0;
        padding: 0.5rem 1rem;
        background: var(--accent-primary);
        color: var(--white-pure);
        border-radius: 0 0 var(--radius-md) 0;
        z-index: var(--z-modal);
      }
      .skip-link:focus { top: 0; }
      .site-header { position: sticky; top: 0; z-index: var(--z-sticky); }
    </style>
  </body>
</html>
